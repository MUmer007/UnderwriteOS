name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uw
          POSTGRES_PASSWORD: uw
          POSTGRES_DB: uw
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python pin 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff (Lint)
        run: uv run ruff check .

      - name: Run Ruff (Format check)
        run: uv run ruff format --check .

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg://uw:uw@localhost:5433/uw
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEXT_MODEL: qwen/qwen3.7-flash
          VISION_MODEL: qwen/qwen3.7-flash
          SMTP_HOST: localhost
          SMTP_PORT: 1025
        run: uv run pytest -v
