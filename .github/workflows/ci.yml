name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python pin 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff (Lint & Format check)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Run MyPy (Type checking)
        run: uv run mypy src/uw --ignore-missing-imports || true

      - name: Run Pytest
        run: uv run pytest
